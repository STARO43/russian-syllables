<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учим слоги</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #1c2333;
            --border: #30363d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #2dd4bf;
            --accent-glow: rgba(45, 212, 191, 0.25);
            --learned: #3fb950;
            --learned-bg: rgba(63, 185, 80, 0.15);
            --danger: #f85149;
            --danger-glow: rgba(248, 81, 73, 0.2);
            --radius: 12px;
            --transition: 0.2s ease;
            --font: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 32px 20px 16px;
            text-align: center;
            background: linear-gradient(180deg, rgba(45, 212, 191, 0.06) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e6edf3 60%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .controls {
            max-width: 1000px;
            margin: 12px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .speed-control label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .speed-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .speed-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .speed-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .speed-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            min-width: 44px;
            text-align: center;
        }

        .grid-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 40px;
            flex: 1;
            width: 100%;
        }
        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .syllable-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 8px;
            text-align: center;
            cursor: pointer;
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 700;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background var(--transition),
                border-color var(--transition),
                box-shadow var(--transition),
                transform var(--transition);
            position: relative;
            font-family: var(--font);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        .syllable-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateY(-2px);
        }
        .syllable-card:active {
            transform: scale(0.97);
            box-shadow: 0 0 6px var(--accent-glow);
        }
        .syllable-card.playing {
            border-color: var(--accent);
            background: var(--accent-glow);
            box-shadow: 0 0 16px var(--accent-glow);
            animation: playingGlow 0.7s infinite alternate;
        }
        .syllable-card.learned {
            background: var(--learned-bg);
            border-color: var(--learned);
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.3);
        }
        .syllable-card.learned .check-mark {
            display: flex;
        }
        .check-mark {
            position: absolute;
            top: 4px;
            left: 6px;
            width: 28px;
            height: 28px;
            background: rgba(63, 185, 80, 0.2);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--learned);
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: auto;
            cursor: pointer;
            transition: var(--transition);
            z-index: 2;
        }
        .check-mark:hover {
            background: rgba(63, 185, 80, 0.4);
            transform: scale(1.1);
        }

        @keyframes playingGlow {
            0% { box-shadow: 0 0 8px var(--accent-glow); }
            100% { box-shadow: 0 0 20px var(--accent-glow); }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            max-width: 90vw;
            text-align: center;
            pointer-events: auto;
        }
        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px var(--danger-glow);
        }
        .toast.success {
            border-color: #3fb950;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px rgba(63, 185, 80, 0.3);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(10px); }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .syllable-grid {
                gap: 5px;
            }
            .syllable-card {
                font-size: clamp(1.5rem, 6vw, 2rem);
                padding: 15px 4px;
                border-radius: 8px;
                min-height: 60px;
            }
            .check-mark {
                width: 24px;
                height: 24px;
                font-size: 1rem;
                top: 3px;
                left: 3px;
            }
            .header {
                padding: 24px 16px 12px;
            }
            .grid-container {
                padding: 12px 12px 32px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Учим слоги</h1>
        <p>Жми, слушай, повторяй</p>
    </header>

    <div class="controls">
        <div class="speed-control">
            <label>⏱ Скорость:</label>
            <button class="speed-btn" id="speedDown" title="Медленнее">−</button>
            <span class="speed-value" id="speedValue">1.0x</span>
            <button class="speed-btn" id="speedUp" title="Быстрее">+</button>
        </div>
    </div>

    <main class="grid-container">
        <div class="syllable-grid" id="syllableGrid"></div>
    </main>

    <footer class="footer">
        <p>Клик по слогу — озвучка · Клик по галочке — отметить изученный</p>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ============ СПИСОК СЛОГОВ (160) ============
            const syllables = [
                'ТО', 'НА', 'ГО', 'НЕ', 'НО', 'ПО', 'РА', 'КО', 'НИ', 'ВО',
                'КА', 'ЛА', 'РО', 'ЛИ', 'ЛО', 'РЕ', 'ТА', 'ВА', 'ЗА', 'РИ',
                'ДЕ', 'ВЕ', 'ТЕ', 'ДА', 'ЛЕ', 'БЫ', 'ЖЕ', 'ДО', 'СЕ', 'ТИ',
                'МО', 'МИ', 'НЫ', 'ЧЕ', 'ВИ', 'СЯ', 'СО', 'РУ', 'МЕ', 'МА',
                'НЯ', 'ВЫ', 'ДИ', 'ПЕ', 'КИ', 'МУ', 'ШЕ', 'НУ', 'БО', 'ХО',
                'БЕ', 'ЧА', 'ШИ', 'ЛЯ', 'ДУ', 'РЫ', 'ША', 'СИ', 'СА', 'ЧИ',
                'КУ', 'ТУ', 'ТЫ', 'ЖИ', 'ЖА', 'ЩЕ', 'ЛУ', 'ПА', 'ЛЮ', 'БУ',
                'ЛЫ', 'РЯ', 'БА', 'ГА', 'ЦЕ', 'ХА', 'МЫ', 'ВУ', 'СУ', 'ПИ',
                'ЩИ', 'БИ', 'ГИ', 'ПУ', 'ГУ', 'ЗО', 'ЧУ', 'ДЫ', 'ЦА', 'ЗЫ',
                'ФИ', 'ТЯ', 'ГЕ', 'ЦУ', 'ЗЯ', 'МЯ', 'БЯ', 'ДЯ', 'КЕ', 'ЩА',
                'СЫ', 'ЗИ', 'ПЯ', 'ЦО', 'ШУ', 'ЗУ', 'ПЫ', 'ШО', 'ЗЕ', 'ЦИ',
                'ВЯ', 'ЖУ', 'ЦЫ', 'ХИ', 'НЮ', 'РЮ', 'ФА', 'ФЕ', 'СЮ', 'ХУ',
                'ЩУ', 'ФУ', 'ЗЮ', 'ФО', 'ЧО', 'ТЮ', 'ДЮ', 'ЖО', 'СЁ', 'ХЕ',
                'ЖЮ', 'МЮ', 'ФЫ', 'КЮ', 'БЮ', 'ФЮ', 'ЦЯ', 'ТЁ', 'ЛЁ', 'ТЭ',
                'ПЭ', 'ВЭ', 'ДЁ', 'КЁ', 'МЭ', 'НЭ', 'РЭ', 'ЩО', 'БЭ', 'ВЮ',
                'ДЭ', 'ЖЭ', 'ЛЭ', 'НЁ', 'РЁ', 'СЭ', 'ФЭ', 'ЧЭ', 'ЩЭ', 'ЩЯ'
            ];

            const grid = document.getElementById('syllableGrid');
            const speedDown = document.getElementById('speedDown');
            const speedUp = document.getElementById('speedUp');
            const speedValue = document.getElementById('speedValue');
            const toastContainer = document.getElementById('toastContainer');

            let currentAudio = null;
            let activeCardIndex = null;
            let isPlaying = false;
            let playbackRate = 1.0;
            const MIN_RATE = 0.3;
            const MAX_RATE = 2.0;
            const RATE_STEP = 0.1;

            // Безопасная работа с localStorage
            function loadLearnedSet() {
                try {
                    const data = localStorage.getItem('learned_syllables');
                    return new Set(data ? JSON.parse(data) : []);
                } catch (e) {
                    return new Set();
                }
            }

            function saveLearnedSet(set) {
                try {
                    localStorage.setItem('learned_syllables', JSON.stringify(Array.from(set)));
                } catch (e) {
                    console.warn('Не удалось сохранить отметки');
                }
            }

            let learnedSet = loadLearnedSet();

            function updateSpeedDisplay() {
                speedValue.textContent = playbackRate.toFixed(1) + 'x';
                speedDown.disabled = playbackRate <= MIN_RATE;
                speedUp.disabled = playbackRate >= MAX_RATE;
            }

            function changeSpeed(delta) {
                playbackRate = Math.min(MAX_RATE, Math.max(MIN_RATE, playbackRate + delta));
                updateSpeedDisplay();
                if (currentAudio) currentAudio.playbackRate = playbackRate;
                showToast(`Скорость: ${playbackRate.toFixed(1)}x`, 'success');
            }

            speedDown.addEventListener('click', () => changeSpeed(-RATE_STEP));
            speedUp.addEventListener('click', () => changeSpeed(RATE_STEP));

            function renderGrid() {
                grid.innerHTML = '';
                syllables.forEach((syllable, index) => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.index = index;
                    card.dataset.syllable = syllable;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');

                    const textSpan = document.createElement('span');
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);

                    const checkMark = document.createElement('div');
                    checkMark.className = 'check-mark';
                    checkMark.textContent = '✓';
                    checkMark.title = 'Отметить как изученный';
                    checkMark.setAttribute('role', 'checkbox');
                    checkMark.setAttribute('aria-checked', learnedSet.has(index));
                    card.appendChild(checkMark);

                    if (learnedSet.has(index)) {
                        card.classList.add('learned');
                        checkMark.style.display = 'flex';
                    } else {
                        checkMark.style.display = 'none';
                    }

                    checkMark.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(index);
                    });

                    card.addEventListener('click', () => handleSyllableClick(index));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(index);
                        }
                    });

                    grid.appendChild(card);
                });
            }

            function toggleLearned(index) {
                if (learnedSet.has(index)) {
                    learnedSet.delete(index);
                } else {
                    learnedSet.add(index);
                }
                saveLearnedSet(learnedSet);
                const cards = document.querySelectorAll('.syllable-card');
                const card = cards[index];
                if (card) {
                    const checkMark = card.querySelector('.check-mark');
                    if (learnedSet.has(index)) {
                        card.classList.add('learned');
                        if (checkMark) checkMark.style.display = 'flex';
                    } else {
                        card.classList.remove('learned');
                        if (checkMark) checkMark.style.display = 'none';
                    }
                }
                showToast(learnedSet.has(index) ? '✓ Изученный' : 'Снято', 'success');
            }

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'error') toast.classList.add('error');
                if (type === 'success') toast.classList.add('success');
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            function clearCardStates() {
                document.querySelectorAll('.syllable-card').forEach(card => {
                    card.classList.remove('playing');
                });
            }

            function stopAudio() {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }
                isPlaying = false;
                activeCardIndex = null;
                clearCardStates();
            }

            function handleSyllableClick(index) {
                const syllable = syllables[index];
                stopAudio();
                activeCardIndex = index;
                clearCardStates();
                const cards = document.querySelectorAll('.syllable-card');
                if (cards[index]) cards[index].classList.add('playing');
                isPlaying = true;

                // Используем проверенный endpoint Google TTS (translate.google.com)
                const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q=${encodeURIComponent(syllable)}&tl=ru`;

                const audio = new Audio();
                audio.src = ttsUrl;
                audio.volume = 1;
                audio.playbackRate = playbackRate;
                currentAudio = audio;

                audio.addEventListener('canplaythrough', () => {
                    audio.play().catch(err => {
                        console.error('Ошибка воспроизведения:', err);
                        stopAudio();
                        if (cards[index]) {
                            cards[index].classList.add('error');
                            setTimeout(() => cards[index].classList.remove('error'), 1000);
                        }
                        showToast('Ошибка воспроизведения', 'error');
                    });
                });

                audio.addEventListener('ended', () => stopAudio());

                audio.addEventListener('error', (e) => {
                    console.error('Ошибка загрузки аудио:', e);
                    stopAudio();
                    if (cards[index]) {
                        cards[index].classList.add('error');
                        setTimeout(() => cards[index].classList.remove('error'), 1000);
                    }
                    showToast('Не удалось загрузить аудио', 'error');
                });

                // Пытаемся сразу воспроизвести (браузер сам обработает)
                audio.play().catch(err => {
                    console.error('Ошибка при попытке воспроизведения:', err);
                    stopAudio();
                    if (cards[index]) {
                        cards[index].classList.add('error');
                        setTimeout(() => cards[index].classList.remove('error'), 1000);
                    }
                    showToast('Не удалось воспроизвести', 'error');
                });
            }

            // Инициализация
            renderGrid();
            updateSpeedDisplay();
            console.log(`🔤 Загружено ${syllables.length} слогов`);
        })();
    </script>
</body>
</html>
