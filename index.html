<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Грамотиньо</title>
    <style>
        :root {
            --bg: #0a0e17;
            --bg-card: #111827;
            --bg-card-hover: #1a2433;
            --border: #2a3443;
            --text: #e6edf3;
            --text-secondary: #8b9bb0;
            --accent: #4da3ff;
            --accent-glow: rgba(77, 163, 255, 0.25);
            --learned: #3fb950;
            --learned-bg: rgba(63, 185, 80, 0.2);
            --danger: #f85149;
            --danger-glow: rgba(248, 81, 73, 0.2);
            --radius: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'PT Serif', serif;
        }

        body.light-mode {
            --bg: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #eef1f5;
            --border: #d1d9e2;
            --text: #1a1f2e;
            --text-secondary: #4b5a6b;
            --accent: #1d7be0;
            --accent-glow: rgba(29, 123, 224, 0.15);
            --learned: #2e9e4f;
            --learned-bg: rgba(46, 158, 79, 0.15);
            --danger: #d9382e;
            --danger-glow: rgba(217, 56, 46, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(circle at 20% 20%, rgba(77, 163, 255, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(77, 163, 255, 0.03) 0%, transparent 50%);
        }

        .header {
            padding: 32px 20px 16px;
            text-align: center;
            background: linear-gradient(180deg, rgba(77, 163, 255, 0.06) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
        }
        .theme-toggle button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .theme-toggle button:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--text) 60%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* Панель управления */
        .controls {
            max-width: 900px;
            margin: 12px auto 0;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls select, .controls button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .controls select:hover, .controls button:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .controls button.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }
        .hidden {
            display: none !important;
        }

        .grid-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            flex: 1;
            width: 100%;
        }
        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .syllable-grid.hide-learned .syllable-card.learned {
            display: none;
        }

        .syllable-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            font-weight: 600;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background var(--transition),
                border-color var(--transition),
                box-shadow var(--transition),
                transform var(--transition),
                color 0.3s;
            position: relative;
            font-family: var(--font);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .syllable-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-2px);
        }
        .syllable-card:active {
            transform: scale(0.97);
            box-shadow: 0 0 6px var(--accent-glow);
        }
        .syllable-card.playing {
            border-color: var(--accent);
            background: var(--accent-glow);
            box-shadow: 0 0 16px var(--accent-glow);
            animation: playingGlow 0.7s infinite alternate;
        }
        .syllable-card.learned {
            background: var(--learned-bg);
            border-color: var(--learned);
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.3);
        }
        .syllable-card.learned .syllable-text {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .syllable-text {
            pointer-events: none;
        }
        .learn-dot {
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 16px;
            height: 16px;
            background: var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            z-index: 2;
            pointer-events: auto;
        }
        .learn-dot:hover {
            transform: scale(1.3);
            background: var(--text-secondary);
        }
        .syllable-card.learned .learn-dot {
            background: var(--learned);
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.6);
        }

        @keyframes playingGlow {
            0% { box-shadow: 0 0 8px var(--accent-glow); }
            100% { box-shadow: 0 0 20px var(--accent-glow); }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            max-width: 90vw;
            text-align: center;
            pointer-events: auto;
        }
        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px var(--danger-glow);
        }
        .toast.success {
            border-color: #3fb950;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px rgba(63, 185, 80, 0.3);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(10px); }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 900px) {
            .syllable-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }
        @media (max-width: 600px) {
            .syllable-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }
            .syllable-card {
                font-size: 1rem;
                padding: 12px 4px;
                border-radius: 8px;
                min-height: 50px;
            }
            .learn-dot {
                width: 12px;
                height: 12px;
                bottom: 4px;
                right: 4px;
            }
            .header {
                padding: 24px 16px 12px;
            }
            .grid-container {
                padding: 12px 12px 32px;
            }
            .controls {
                gap: 6px;
            }
            .controls select, .controls button {
                padding: 6px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="theme-toggle">
            <button id="themeToggle" title="Переключить тему">🌓</button>
        </div>
        <h1>Грамотиньо</h1>
        <p>Жми, слушай, запоминай</p>
    </header>

    <!-- Панель управления -->
    <div class="controls">
        <div class="control-group">
            <label for="sortMode">Сортировка:</label>
            <select id="sortMode">
                <option value="default" selected>По умолчанию</option>
                <option value="vowels">От гласных</option>
                <option value="random">10 случайных</option>
            </select>
        </div>
        <div class="control-group">
            <button id="randomRefresh" class="hidden" title="Заменить случайные">🔄 Заменить</button>
        </div>
        <div class="control-group">
            <label for="hideLearned">Скрыть отмеченные</label>
            <input type="checkbox" id="hideLearned">
        </div>
    </div>

    <main class="grid-container">
        <div class="syllable-grid" id="syllableGrid"></div>
    </main>

    <footer class="footer">
        <p>Спасибо автору в тг @vnvax</p>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // Исходный список элементов (после удаления указанных слогов)
            const rawItems = [
                'ЁЖ', 'ёлка', 'ЁН', 'АБ', 'АВ', 'АГ', 'АД', 'АЖ', 'АЗ', 'АК', 'АЛ', 'Алла', 'АМ', 'АН', 'Анна', 'АП', 'арка', 'арфа', 'АС', 'АТ', 'АХ', 'АЧ', 'АШ',
                'БА', 'БАК', 'БАЯН', 'БЕ', 'БИ', 'БО', 'БОК', 'БОР', 'Боря', 'БЫ', 'БЫК', 'БЭ', 'БЮ', 'БЯ',
                'ВА', 'Валя', 'ВЕ', 'ВЕЕР', 'ВИ', 'Витя', 'Вова', 'ВОЗ', 'ВОЛ', 'ВОЛК', 'ВУ', 'ВЫ', 'ВЭ', 'ВЮ',
                'ГА', 'ГАЗ', 'Галя', 'ГЕ', 'Гена', 'ГИ', 'ГО', 'ГОД', 'ГЫ', 'ГЭ',
                'ДА', 'ДИ', 'ДОМ', 'ДУ', 'ДУБ', 'ДУШ', 'ДЫ', 'ДЫМ', 'ДЭ', 'ДЮ', 'ДЯ',
                'ЕГ', 'ЕД', 'ЕЖ', 'ЕЛ', 'ЕМ', 'ЕН', 'ЕР', 'ЕС', 'если', 'ЕТ', 'ЕФ', 'ЕХ', 'ЕЦ', 'ЕЧ', 'ЕШ',
                'ЖА', 'Женя', 'ЖИ', 'ЖО', 'ЖУ', 'ЖУК', 'ЖЭ',
                'ЗА', 'ЗИ', 'Зина', 'ЗО', 'ЗУ', 'ЗЫ', 'ЗЭ', 'ЗЮ', 'ЗЯ',
                'ИБ', 'ИВ', 'игра', 'ИЖ', 'ИК', 'икра', 'ИЛ', 'ИМ', 'ИН', 'ИР', 'ИС', 'ИТ', 'ИФ', 'ИХ', 'ИЧ', 'ИШ',
                'ЙОД', 'КА', 'Катя', 'КЕ', 'КИ', 'КИТ', 'КОЛ', 'Коля', 'КОМ', 'КОТ', 'КОФЕ', 'КРАЙ', 'КРАН', 'КУ', 'КЫ', 'КЭ',
                'ЛЁ', 'Лёва', 'Лёша', 'ЛАК', 'ЛЕ', 'ЛЕВ', 'Лена', 'ЛЕС', 'ЛЕЩ', 'ЛИ', 'ЛИФТ', 'ЛО', 'ЛОМ', 'ЛУ', 'ЛЫ', 'ЛЫЖИ', 'ЛЭ', 'ЛЮ', 'Люба', 'Люда', 'ЛЮК', 'ЛЯ',
                'МА', 'МАК', 'МЕ', 'МЕЛ', 'МЕХ', 'МЕЧ', 'МИ', 'Миша', 'МО', 'МОХ', 'МУ', 'МУХА', 'МЫ', 'МЫЛО', 'МЫС', 'МЭ', 'МЯ', 'МЯЧ',
                'НЁ', 'НА', 'НЕ', 'Нина', 'НО', 'НОЖ', 'НОС', 'НУ', 'НЫ', 'НЭ', 'НЯ',
                'ОД', 'одна', 'ОЖ', 'ОКНО', 'ОЛ', 'ОМ', 'ОН', 'ОП', 'ОР', 'ОС', 'ОФ', 'ОХ', 'ОЧ', 'очки', 'ОШ',
                'ПА', 'ПАУК', 'ПЕРО', 'Петя', 'ПИ', 'ПУ', 'ПУХ', 'ПЫ', 'ПЭ', 'ПЯ',
                'РА', 'РАК', 'РИ', 'РИС', 'РО', 'Рома', 'РОТ', 'РУ', 'РЫ', 'РЫБА', 'РЭ', 'РЮ', 'РЯ',
                'СЁ', 'СА', 'Саша', 'СЕ', 'СИ', 'СОК', 'СОМ', 'СОР', 'СТУЛ', 'СУ', 'СУК', 'СУП', 'СЫ', 'СЫР', 'СЭ', 'СЮ', 'СЯ',
                'Тёма', 'ТА', 'ТАЗ', 'Таня', 'ТЕ', 'ТИ', 'ТО', 'Толя', 'Тома', 'ТОРТ', 'ТРОС', 'ТУ', 'ТЫ', 'ТЭ', 'ТЮ', 'ТЯ',
                'УБ', 'УГ', 'УГОЛ', 'УД', 'УЖ', 'УЛ', 'УМ', 'УН', 'УР', 'урна', 'УС', 'УТ', 'утка', 'утро', 'УФ', 'УХ', 'УХО', 'УЧ', 'УШ', 'ушко',
                'ФА', 'ФЕ', 'Федя', 'ФИ', 'ФО', 'ФУ', 'ФЫ', 'ФЭ',
                'ХА', 'ХЕ', 'ХО', 'ХУ', 'ХЫ', 'ХЭ',
                'ЦА', 'ЦЕ', 'ЦИ', 'ЦО', 'ЦУ', 'ЦЭ',
                'ЧА', 'ЧАЙ', 'ЧЕК', 'ЧИ', 'ЧУ', 'ЧЭ',
                'ША', 'ШАГ', 'ШЕ', 'ШИ', 'ШОВ', 'ШУ', 'ШЭ',
                'ЩИ', 'ЩИТ',
                'ЫБ', 'ЫВ', 'ЫК', 'ЫМ', 'ЫН', 'ЫС', 'ЫТ', 'ЫХ',
                'ЭБ', 'ЭГ', 'ЭД', 'ЭК', 'ЭЛ', 'ЭМ', 'ЭН', 'ЭП', 'ЭР', 'ЭС', 'ЭТ', 'ЭФ', 'ЭХ', 'ЭЦ',
                'юбка', 'ЮГ', 'юнга', 'ЯБ', 'ЯВ', 'ЯГ', 'ЯД', 'ЯК', 'ЯЛ', 'ЯМ', 'ЯН', 'ЯП', 'ЯР', 'ЯС', 'ЯТ', 'ЯХ', 'яхта', 'ЯЦ'
            ];

            // Классификация слов
            const names = new Set([
                'Алла', 'Анна', 'Боря', 'Валя', 'Витя', 'Вова', 'Галя', 'Гена', 'Женя', 'Зина',
                'Катя', 'Коля', 'Лёва', 'Лёша', 'Лена', 'Люба', 'Люда', 'Миша', 'Нина', 'Петя',
                'Рома', 'Саша', 'Тёма', 'Таня', 'Толя', 'Тома', 'Федя'
            ]);
            const misc = new Set(['если', 'одна', 'игра', 'утро', 'юнга']); // остальные слова, не являющиеся именами и вещами

            const vowels = ['а', 'е', 'ё', 'и', 'о', 'у', 'ы', 'э', 'ю', 'я'];

            // Получение гласной буквы для двухбуквенного слога
            function getVowel(syllable) {
                if (syllable.length !== 2) return null;
                const lower = syllable.toLowerCase();
                const first = lower[0];
                const second = lower[1];
                if (vowels.includes(first) && !vowels.includes(second)) return first;
                if (!vowels.includes(first) && vowels.includes(second)) return second;
                return null; // если обе гласные или обе согласные (не слог)
            }

            // Сортировка "по умолчанию": длина, затем алфавит
            function sortDefault(arr) {
                return arr.slice().sort((a, b) => {
                    const lenDiff = a.length - b.length;
                    if (lenDiff !== 0) return lenDiff;
                    return a.localeCompare(b, 'ru', { sensitivity: 'base' });
                });
            }

            // Сортировка "от гласных": слоги по гласным, затем имена, вещи, остальное
            function sortVowels(arr) {
                const syllables = [];
                const others = [];
                arr.forEach(item => {
                    if (item.length === 2 && getVowel(item)) {
                        syllables.push(item);
                    } else {
                        others.push(item);
                    }
                });

                // Группируем слоги по гласной
                const groups = {};
                vowels.forEach(v => groups[v] = []);
                syllables.forEach(syl => {
                    const v = getVowel(syl);
                    if (v) groups[v].push(syl);
                });

                const sortedSyllables = [];
                vowels.forEach(v => {
                    groups[v].sort((a, b) => a.localeCompare(b, 'ru', { sensitivity: 'base' }));
                    sortedSyllables.push(...groups[v]);
                });

                // Слова: имена, вещи, остальное
                const namesArr = others.filter(w => names.has(w)).sort((a, b) => a.localeCompare(b, 'ru'));
                const thingsArr = others.filter(w => !names.has(w) && !misc.has(w)).sort((a, b) => a.localeCompare(b, 'ru'));
                const miscArr = others.filter(w => misc.has(w)).sort((a, b) => a.localeCompare(b, 'ru'));

                return [...sortedSyllables, ...namesArr, ...thingsArr, ...miscArr];
            }

            // Функция для получения отображаемых элементов в зависимости от режима
            function getDisplayedItems() {
                const mode = sortModeSelect.value;
                if (mode === 'random') {
                    if (randomItems.length === 0) generateRandomItems();
                    return randomItems;
                } else if (mode === 'vowels') {
                    return sortVowels(rawItems);
                } else {
                    return sortDefault(rawItems);
                }
            }

            // Генерация 10 случайных элементов
            function generateRandomItems() {
                const shuffled = rawItems.slice().sort(() => Math.random() - 0.5);
                randomItems = shuffled.slice(0, Math.min(10, shuffled.length));
            }

            // Элементы DOM
            const grid = document.getElementById('syllableGrid');
            const toastContainer = document.getElementById('toastContainer');
            const themeToggle = document.getElementById('themeToggle');
            const sortModeSelect = document.getElementById('sortMode');
            const randomRefreshBtn = document.getElementById('randomRefresh');
            const hideLearnedCheckbox = document.getElementById('hideLearned');

            let currentAudio = null;
            let activeCardIndex = null;
            let isPlaying = false;
            let randomItems = [];

            // Изученные элементы храним как Set строк
            function loadLearnedSet() {
                try {
                    const data = localStorage.getItem('learned_syllables');
                    return new Set(data ? JSON.parse(data) : []);
                } catch (e) {
                    return new Set();
                }
            }

            function saveLearnedSet(set) {
                try {
                    localStorage.setItem('learned_syllables', JSON.stringify(Array.from(set)));
                } catch (e) {
                    console.warn('Не удалось сохранить отметки');
                }
            }

            let learnedSet = loadLearnedSet();

            // Инициализация темы
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
                localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            });

            // Переключение режима сортировки
            sortModeSelect.addEventListener('change', () => {
                if (sortModeSelect.value === 'random') {
                    randomItems = [];
                    randomRefreshBtn.classList.remove('hidden');
                } else {
                    randomRefreshBtn.classList.add('hidden');
                }
                renderGrid();
            });

            // Обновление случайных карточек
            randomRefreshBtn.addEventListener('click', () => {
                generateRandomItems();
                renderGrid();
            });

            // Скрытие изученных
            hideLearnedCheckbox.addEventListener('change', () => {
                grid.classList.toggle('hide-learned', hideLearnedCheckbox.checked);
            });

            function renderGrid() {
                grid.innerHTML = '';
                const items = getDisplayedItems();
                items.forEach((syllable) => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.syllable = syllable;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');

                    const textSpan = document.createElement('span');
                    textSpan.className = 'syllable-text';
                    textSpan.textContent = syllable;
                    textSpan.style.pointerEvents = 'none';
                    card.appendChild(textSpan);

                    const dot = document.createElement('div');
                    dot.className = 'learn-dot';
                    dot.title = 'Отметить';
                    dot.setAttribute('role', 'checkbox');
                    dot.setAttribute('aria-checked', learnedSet.has(syllable));
                    card.appendChild(dot);

                    if (learnedSet.has(syllable)) {
                        card.classList.add('learned');
                    }

                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleLearned(syllable, card);
                    });

                    card.addEventListener('click', () => handleSyllableClick(syllable, card));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(syllable, card);
                        }
                    });

                    grid.appendChild(card);
                });
                console.log(`🔤 Показано ${items.length} элементов`);
            }

            function toggleLearned(syllable, card) {
                if (learnedSet.has(syllable)) {
                    learnedSet.delete(syllable);
                } else {
                    learnedSet.add(syllable);
                }
                saveLearnedSet(learnedSet);
                card.classList.toggle('learned', learnedSet.has(syllable));
                // если скрытие включено, скрываем/показываем карточку автоматически (CSS)
            }

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'error') toast.classList.add('error');
                if (type === 'success') toast.classList.add('success');
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            function clearPlayingState() {
                document.querySelectorAll('.syllable-card').forEach(card => {
                    card.classList.remove('playing');
                });
                isPlaying = false;
                activeCardIndex = null;
                currentAudio = null;
            }

            function stopAudio() {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }
                clearPlayingState();
            }

            function handleSyllableClick(syllable, card) {
                stopAudio();
                card.classList.add('playing');
                isPlaying = true;

                const audio = new Audio('audio/' + syllable + '.mp3');
                audio.volume = 1;
                currentAudio = audio;

                audio.addEventListener('ended', () => {
                    clearPlayingState();
                });

                audio.addEventListener('error', (e) => {
                    console.error('Ошибка загрузки аудио:', e);
                    clearPlayingState();
                    card.classList.add('error');
                    setTimeout(() => card.classList.remove('error'), 1000);
                    showToast('Не удалось загрузить аудио', 'error');
                });

                audio.play().catch(err => {
                    if (err.name === 'AbortError') {
                        console.log('Воспроизведение прервано');
                    } else {
                        console.error('Ошибка воспроизведения:', err);
                        clearPlayingState();
                        card.classList.add('error');
                        setTimeout(() => card.classList.remove('error'), 1000);
                        showToast('Ошибка воспроизведения', 'error');
                    }
                });
            }

            // Первоначальный рендер
            renderGrid();
        })();
    </script>
</body>
</html>
