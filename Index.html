<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖМИ — СЛУШАЙ — ПОВТОРЯЙ</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #1c2333;
            --border: #30363d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #2dd4bf;
            --accent-dim: #0d9488;
            --accent-glow: rgba(45, 212, 191, 0.25);
            --danger: #f85149;
            --danger-glow: rgba(248, 81, 73, 0.2);
            --radius: 10px;
            --transition: 0.2s ease;
            --font: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Header ---------- */
        .header {
            padding: 32px 20px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(45, 212, 191, 0.06) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e6edf3 60%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 8px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---------- Settings ---------- */
        .settings-toggle {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }
        .settings-toggle button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: var(--font);
        }
        .settings-toggle button:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .settings-panel {
            max-width: 560px;
            margin: 12px auto 0;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: none;
            animation: slideDown 0.25s ease;
        }
        .settings-panel.open {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-panel label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .settings-panel input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 14px;
            font-family: var(--font);
            transition: border-color var(--transition);
        }
        .settings-panel input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .settings-panel .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings-panel .btn-save {
            background: var(--accent);
            color: #0d1117;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            font-family: var(--font);
        }
        .settings-panel .btn-save:hover {
            background: #5eead4;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .settings-panel .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .settings-panel .hint a {
            color: var(--accent);
            text-decoration: none;
        }
        .settings-panel .hint a:hover {
            text-decoration: underline;
        }

        /* ---------- Status ---------- */
        .status-bar {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: background 0.3s;
        }
        .status-dot.ready {
            background: #3fb950;
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.5);
        }
        .status-dot.error {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger-glow);
        }
        .status-dot.loading {
            background: #d29922;
            animation: pulse 1s infinite;
        }
        .status-dot.playing {
            background: var(--accent);
            animation: pulse 0.6s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.4);
            }
        }

        .stop-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            font-family: var(--font);
        }
        .stop-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .stop-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ---------- Grid ---------- */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }
        .syllable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 6px;
        }

        .syllable-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 4px;
            text-align: center;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background var(--transition),
                border-color var(--transition),
                box-shadow var(--transition),
                transform var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .syllable-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            transform: translateY(-1px);
        }
        .syllable-card:active {
            transform: scale(0.96);
            box-shadow: 0 0 6px var(--accent-glow);
        }
        .syllable-card .rank {
            position: absolute;
            top: 2px;
            right: 5px;
            font-size: 0.55rem;
            color: var(--text-secondary);
            opacity: 0.5;
            pointer-events: none;
        }
        .syllable-card.loading {
            border-color: #d29922;
            animation: loadingPulse 0.8s infinite;
        }
        .syllable-card.playing {
            border-color: var(--accent);
            background: var(--accent-glow);
            box-shadow: 0 0 16px var(--accent-glow);
            animation: playingGlow 0.7s infinite alternate;
        }
        .syllable-card.error {
            border-color: var(--danger);
            box-shadow: 0 0 10px var(--danger-glow);
            animation: shake 0.4s;
        }
        @keyframes loadingPulse {
            0%,
            100% {
                box-shadow: 0 0 4px rgba(210, 153, 34, 0.3);
            }
            50% {
                box-shadow: 0 0 12px rgba(210, 153, 34, 0.6);
            }
        }
        @keyframes playingGlow {
            0% {
                box-shadow: 0 0 8px var(--accent-glow);
            }
            100% {
                box-shadow: 0 0 20px var(--accent-glow);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-4px);
            }
            40% {
                transform: translateX(4px);
            }
            60% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(3px);
            }
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            max-width: 90vw;
            text-align: center;
            pointer-events: auto;
        }
        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px var(--danger-glow);
        }
        .toast.success {
            border-color: #3fb950;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 12px rgba(63, 185, 80, 0.3);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        /* ---------- Footer ---------- */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 600px) {
            .syllable-grid {
                grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
                gap: 4px;
            }
            .syllable-card {
                font-size: 1rem;
                padding: 10px 2px;
                border-radius: 6px;
            }
            .syllable-card .rank {
                font-size: 0.5rem;
                top: 1px;
                right: 3px;
            }
            .header {
                padding: 24px 16px 16px;
            }
            .settings-panel {
                margin: 12px 16px 0;
                padding: 16px;
            }
            .grid-container {
                padding: 12px 12px 32px;
            }
        }
        @media (max-width: 380px) {
            .syllable-grid {
                grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
                gap: 3px;
            }
            .syllable-card {
                font-size: 0.9rem;
                padding: 8px 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>200 русских слогов</h1>
        <p>От самых частотных к менее частотным. Нажмите на слог, чтобы услышать его произношение.</p>
        <div class="settings-toggle">
            <button id="toggleSettingsBtn">⚙️ Настройки API</button>
        </div>
    </header>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <label for="apiKeyInput">API ключ ElevenLabs</label>
        <input type="password" id="apiKeyInput" placeholder="sk_..." autocomplete="off">
        <label for="voiceIdInput">Voice ID</label>
        <input type="text" id="voiceIdInput" placeholder="pNInz6obpgDQGcFmaJgB" value="pNInz6obpgDQGcFmaJgB">
        <div class="btn-row">
            <button class="btn-save" id="saveSettingsBtn">Сохранить</button>
            <span class="hint">
                Ключ хранится только в вашем браузере (localStorage).<br>
                <a href="https://elevenlabs.io/app/sign-in" target="_blank" rel="noopener">Получить ключ →</a>
            </span>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ключ не настроен</span>
        </div>
        <button class="stop-btn" id="stopBtn" disabled title="Остановить воспроизведение">⏹ Стоп</button>
    </div>

    <!-- Main Grid -->
    <main class="grid-container">
        <div class="syllable-grid" id="syllableGrid"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Произношение через <a href="https://elevenlabs.io" target="_blank" rel="noopener">ElevenLabs</a> · Русские слоги по частотности</p>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ============ Слоги ============
            const syllables = [
                // 1-10 (наиболее частотные)
                'на', 'не', 'то', 'ра', 'ка', 'ро', 'та', 'ре', 'ни', 'но',
                // 11-20
                'ли', 'ко', 'ла', 'ма', 'ти', 'ми', 'ва', 'да', 'за', 'са',
                // 21-30
                'те', 'ле', 'го', 'се', 'ве', 'ри', 'ло', 'мо', 'ви', 'де',
                // 31-40
                'во', 'со', 'би', 'по', 'бе', 'до', 'ме', 'си', 'ди', 'зи',
                // 41-50
                'бо', 'вы', 'че', 'чи', 'же', 'жи', 'ша', 'ше', 'ши', 'пи',
                // 51-60
                'га', 'ба', 'пе', 'па', 'ге', 'ду', 'ру', 'ку', 'му', 'су',
                // 61-70
                'лу', 'ну', 'ту', 'бу', 'пу', 'гу', 'зу', 'ву', 'фу', 'ху',
                // 71-80
                'цу', 'ня', 'тя', 'ря', 'ля', 'мя', 'ся', 'вя', 'дя', 'зя',
                // 81-90
                'бя', 'пя', 'гя', 'фя', 'хя', 'нё', 'тё', 'рё', 'лё', 'мё',
                // 91-100
                'сё', 'вё', 'дё', 'зё', 'бё', 'пё', 'гё', 'фё', 'хё', 'ню',
                // 101-110
                'тю', 'рю', 'лю', 'мю', 'сю', 'вю', 'дю', 'зю', 'бю', 'пю',
                // 111-120
                'гю', 'фю', 'хю', 'ны', 'ты', 'ры', 'лы', 'мы', 'сы', 'вы',
                // 121-130
                'ды', 'зы', 'бы', 'пы', 'гы', 'фы', 'хы', 'цы', 'нэ', 'тэ',
                // 131-140
                'рэ', 'лэ', 'мэ', 'сэ', 'вэ', 'дэ', 'зэ', 'бэ', 'пэ', 'гэ',
                // 141-150
                'фэ', 'хэ', 'ча', 'чо', 'чу', 'чё', 'чю', 'жа', 'жо', 'жу',
                // 151-160
                'жё', 'жю', 'ща', 'що', 'щу', 'щё', 'ще', 'щи', 'а', 'о',
                // 161-170
                'у', 'э', 'и', 'ы', 'е', 'я', 'ё', 'ю', 'ан', 'он',
                // 171-180
                'ин', 'ун', 'ен', 'ар', 'ор', 'ир', 'ур', 'ер', 'ал', 'ол',
                // 181-190
                'ил', 'ул', 'ел', 'ам', 'ом', 'им', 'ум', 'ем', 'ас', 'ос',
                // 191-200
                'ис', 'ус', 'ес', 'ак', 'ок', 'ик', 'ук', 'ек', 'ат', 'от'
            ];

            // ============ DOM-элементы ============
            const grid = document.getElementById('syllableGrid');
            const settingsPanel = document.getElementById('settingsPanel');
            const toggleBtn = document.getElementById('toggleSettingsBtn');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const voiceIdInput = document.getElementById('voiceIdInput');
            const saveBtn = document.getElementById('saveSettingsBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const stopBtn = document.getElementById('stopBtn');
            const toastContainer = document.getElementById('toastContainer');

            // ============ Состояние ============
            let apiKey = localStorage.getItem('elevenlabs_api_key') || '';
            let voiceId = localStorage.getItem('elevenlabs_voice_id') || 'pNInz6obpgDQGcFmaJgB';
            let currentAudio = null;
            let currentObjectUrl = null;
            let activeCardIndex = null;
            let isPlaying = false;

            // ============ Рендер сетки ============
            function renderGrid() {
                grid.innerHTML = '';
                syllables.forEach((syllable, index) => {
                    const card = document.createElement('div');
                    card.className = 'syllable-card';
                    card.dataset.index = index;
                    card.dataset.syllable = syllable;
                    card.title = `Слог «${syllable}» — ранг ${index + 1}`;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', `Слог ${syllable}, ранг ${index + 1}`);

                    const textSpan = document.createElement('span');
                    textSpan.textContent = syllable;
                    card.appendChild(textSpan);

                    const rankSpan = document.createElement('span');
                    rankSpan.className = 'rank';
                    rankSpan.textContent = index + 1;
                    card.appendChild(rankSpan);

                    card.addEventListener('click', () => handleSyllableClick(index));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleSyllableClick(index);
                        }
                    });

                    grid.appendChild(card);
                });
            }

            // ============ Обновление статуса ============
            function updateStatus(state, message) {
                statusDot.className = 'status-dot';
                if (state === 'ready') {
                    statusDot.classList.add('ready');
                } else if (state === 'error') {
                    statusDot.classList.add('error');
                } else if (state === 'loading') {
                    statusDot.classList.add('loading');
                } else if (state === 'playing') {
                    statusDot.classList.add('playing');
                }
                statusText.textContent = message;
            }

            function refreshStatus() {
                if (!apiKey) {
                    updateStatus('', 'Ключ не настроен');
                    statusDot.className = 'status-dot';
                } else if (isPlaying) {
                    updateStatus('playing', 'Воспроизведение...');
                } else {
                    updateStatus('ready', 'Готов к работе');
                }
            }

            // ============ Toast-уведомления ============
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'error') toast.classList.add('error');
                if (type === 'success') toast.classList.add('success');
                toast.textContent = message;
                toastContainer.appendChild(toast);
                // Удаляем после завершения анимации
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 3200);
            }

            // ============ Сброс состояния карточек ============
            function clearCardStates() {
                document.querySelectorAll('.syllable-card').forEach(card => {
                    card.classList.remove('loading', 'playing', 'error');
                });
            }

            function setCardState(index, state) {
                clearCardStates();
                const cards = document.querySelectorAll('.syllable-card');
                if (cards[index] && state) {
                    cards[index].classList.add(state);
                }
            }

            // ============ Остановка аудио ============
            function stopAudio() {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = null;
                }
                isPlaying = false;
                activeCardIndex = null;
                clearCardStates();
                stopBtn.disabled = true;
                refreshStatus();
            }

            // ============ Обработка клика по слогу ============
            async function handleSyllableClick(index) {
                const syllable = syllables[index];

                if (!apiKey) {
                    showToast('⚠️ Введите API-ключ ElevenLabs в настройках', 'error');
                    settingsPanel.classList.add('open');
                    apiKeyInput.focus();
                    return;
                }

                if (!voiceId.trim()) {
                    showToast('⚠️ Укажите Voice ID', 'error');
                    return;
                }

                // Останавливаем предыдущее аудио
                stopAudio();

                // Отмечаем карточку как загружающуюся
                activeCardIndex = index;
                setCardState(index, 'loading');
                updateStatus('loading', `Загрузка «${syllable}»...`);
                stopBtn.disabled = false;

                try {
                    const response = await fetch(
                        `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voiceId.trim())}`, {
                            method: 'POST',
                            headers: {
                                'xi-api-key': apiKey,
                                'Content-Type': 'application/json',
                                'Accept': 'audio/mpeg'
                            },
                            body: JSON.stringify({
                                text: syllable,
                                model_id: 'eleven_multilingual_v2',
                                voice_settings: {
                                    stability: 0.4,
                                    similarity_boost: 0.75,
                                    style: 0.0,
                                    use_speaker_boost: true
                                }
                            })
                        }
                    );

                    if (!response.ok) {
                        let errorDetail = `Ошибка ${response.status}`;
                        try {
                            const errData = await response.json();
                            if (errData.detail && errData.detail.status) {
                                errorDetail = errData.detail.message || errData.detail.status;
                            } else if (errData.message) {
                                errorDetail = errData.message;
                            }
                        } catch (e) { /* ignore */ }
                        throw new Error(errorDetail);
                    }

                    const audioBlob = await response.blob();
                    if (!audioBlob || audioBlob.size === 0) {
                        throw new Error('Пустой аудио-ответ');
                    }

                    // Воспроизводим аудио
                    if (currentObjectUrl) {
                        URL.revokeObjectURL(currentObjectUrl);
                    }
                    currentObjectUrl = URL.createObjectURL(audioBlob);
                    currentAudio = new Audio(currentObjectUrl);

                    // Отмечаем карточку как играющую
                    setCardState(index, 'playing');
                    isPlaying = true;
                    updateStatus('playing', `Произношу «${syllable}»`);

                    currentAudio.addEventListener('ended', () => {
                        stopAudio();
                        refreshStatus();
                    });

                    currentAudio.addEventListener('error', () => {
                        stopAudio();
                        setCardState(index, 'error');
                        showToast('Ошибка воспроизведения аудио', 'error');
                        refreshStatus();
                    });

                    currentAudio.play().catch(err => {
                        stopAudio();
                        setCardState(index, 'error');
                        showToast('Не удалось воспроизвести: ' + err.message, 'error');
                        refreshStatus();
                    });

                } catch (err) {
                    setCardState(index, 'error');
                    isPlaying = false;
                    stopBtn.disabled = true;
                    updateStatus('error', 'Ошибка запроса');
                    showToast('❌ ' + err.message, 'error');
                    console.error('ElevenLabs API error:', err);

                    // Сбрасываем состояние карточки через 1.5 сек
                    setTimeout(() => {
                        const cards = document.querySelectorAll('.syllable-card');
                        if (cards[index]) cards[index].classList.remove('error');
                        if (activeCardIndex === index) activeCardIndex = null;
                        refreshStatus();
                    }, 1500);
                }
            }

            // ============ Настройки ============
            toggleBtn.addEventListener('click', () => {
                settingsPanel.classList.toggle('open');
            });

            function loadSettings() {
                apiKeyInput.value = apiKey;
                voiceIdInput.value = voiceId;
                refreshStatus();
            }

            saveBtn.addEventListener('click', () => {
                apiKey = apiKeyInput.value.trim();
                voiceId = voiceIdInput.value.trim() || 'pNInz6obpgDQGcFmaJgB';
                localStorage.setItem('elevenlabs_api_key', apiKey);
                localStorage.setItem('elevenlabs_voice_id', voiceId);
                settingsPanel.classList.remove('open');
                showToast('✅ Настройки сохранены', 'success');
                refreshStatus();
            });

            apiKeyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveBtn.click();
            });

            stopBtn.addEventListener('click', stopAudio);

            // ============ Инициализация ============
            renderGrid();
            loadSettings();

            // Обновляем статус при загрузке
            if (!apiKey) {
                updateStatus('', 'Ключ не настроен');
            } else {
                updateStatus('ready', 'Готов к работе');
            }

            console.log(`🔤 Загружено ${syllables.length} русских слогов`);
            console.log('ℹ️  Нажмите, чтобы услышать произношение');
        })();
    </script>
</body>
</html>
